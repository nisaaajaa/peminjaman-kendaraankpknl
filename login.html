<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - KPKNL Metro</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>LOGIN ADMIN</h2>
      <p>KPKNL METRO - KEMENTERIAN KEUANGAN RI</p>
    </div>

    <div class="login-body">
      <form id="loginForm">
        <div class="form-group">
          <label for="email">User / Email Admin</label>
          <input type="text" id="email" class="form-control" placeholder="Masukkan user/email" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-login">Masuk ke Dashboard</button>
      </form>
      
      <a href="index.html" class="btn-back">← Kembali ke Halaman Utama</a>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
